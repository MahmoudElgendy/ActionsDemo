name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore EmployeeApi.Tests/EmployeeApi.Tests.csproj

      - name: Build API and tests
        run: dotnet build EmployeeApi.Tests/EmployeeApi.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test EmployeeApi.Tests/EmployeeApi.Tests.csproj --configuration Release --no-build --no-restore