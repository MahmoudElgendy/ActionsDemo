
name: Frontend Build

on:
  push:
    branches:
      - main
    paths:
      - 'EmployeeWeb/**'
      - '.github/workflows/frontend-build.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'EmployeeWeb/**'
      - '.github/workflows/frontend-build.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: EmployeeWeb/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix EmployeeWeb

      - name: Build frontend
        run: npm run build --prefix EmployeeWeb
