
name: Backend Build and Test

on:
  push:
    branches:
      - main
    paths:
      - 'EmployeeApi/**'
      - 'EmployeeApi.Tests/**'
      - '.github/workflows/backend-build.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'

  pull_request:
    branches:
      - main
    paths:
      - 'EmployeeApi/**'
      - 'EmployeeApi.Tests/**'
      - '.github/workflows/backend-build.yml'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'NuGet.Config'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.303

      - name: Restore dependencies
        run: dotnet restore EmployeeApi.Tests/EmployeeApi.Tests.csproj

      - name: Build API and tests
        run: dotnet build EmployeeApi.Tests/EmployeeApi.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test EmployeeApi.Tests/EmployeeApi.Tests.csproj --configuration Release --no-build --no-restore
